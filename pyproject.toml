[project]
name = "hotel-price-tool"
version = "0.1.0"
description = "Theo dõi giá phòng khách sạn đối thủ trên Agoda, Booking.com, Trip.com"
requires-python = ">=3.11,<3.14"
dependencies = [
    "openpyxl>=3.1.5",
    "playwright>=1.64.1",
    "streamlit>=1.67.0",
]

[project.scripts]
hotel-price = "hotel_price.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hotel_price"]
