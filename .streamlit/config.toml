[server]
headless = true
fileWatcherType = "none"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "viewer"
showErrorDetails = "type"

[theme]
font = "sans serif"
baseRadius = "medium"
showSidebarBorder = true
metricValueFontSize = "1.75rem"

[theme.light]
primaryColor = "#E5484D"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F4F4F6"
textColor = "#18181B"

[theme.light.sidebar]
backgroundColor = "#F8F8FA"

[theme.dark]
primaryColor = "#E5484D"
backgroundColor = "#131316"
secondaryBackgroundColor = "#1E1E23"
textColor = "#ECECF1"

[theme.dark.sidebar]
backgroundColor = "#1A1A1F"
